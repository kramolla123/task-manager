name: Verify task-manager
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack pnpm@10.22.0 install --no-frozen-lockfile
      - run: corepack pnpm@10.22.0 run typecheck
      - run: corepack pnpm@10.22.0 run build
